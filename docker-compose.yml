services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: homepage_backend
    restart: unless-stopped
    volumes:
      - ./backend:/app  # Bind mount for easy code updates
      - ./backend/data:/app/data #Correct bind mount to host path 
      - uploads_data:/app/uploads  # Persistent volume for uploads/media
     # - db_data:/app/data  # Persistent volume for database
    environment:
      - DATABASE_URL=sqlite:///./data/db.sqlite3
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    networks:
      - homepage_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: homepage_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app  # Bind mount for easy updates
      - frontend_build:/app/dist  # Built files
    ports:
      - "3000:3000"
    networks:
      - homepage_network
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: homepage_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/letsencrypt:rw  # Let's Encrypt certs (managed by certbot)
      - ./nginx/cloudflare-ips.conf:/etc/nginx/cloudflare-ips.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro  # legacy path compatibility
      - ./nginx/www:/var/www/certbot:ro  # ACME challenge webroot
      - uploads_data:/var/www/uploads:ro  # Serve uploads directly
      - ./frontend/public:/var/www/html:ro   # Serve public files directly
      - frontend_build:/var/www/build:ro  # Serve React build files
      - ./logs/nginx:/var/log/nginx  # Persist logs for analysis
      - ./goaccess-report:/var/www/goaccess:ro # Serve analytics report
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro # Password protection
    networks:
      - homepage_network
    depends_on:
      - backend
      - frontend

  certbot:
    image: certbot/certbot
    container_name: homepage_certbot
    restart: unless-stopped
    volumes:
      - ./nginx/www:/var/www/certbot
      - ./nginx/ssl:/etc/letsencrypt
    depends_on:
      - nginx
    entrypoint: ["/bin/sh","-c"]
    command: |
      "trap exit TERM; \
      while :; do \
        certbot renew --webroot -w /var/www/certbot --deploy-hook 'nginx -s reload' || true; \
        sleep 12h; \
      done"

  goaccess:
    image: allinurl/goaccess
    container_name: homepage_goaccess
    restart: unless-stopped
    depends_on:
      - nginx
    command: >
      /var/log/nginx/access.log 
      -o /report/index.html 
      --log-format=COMBINED 
      --real-time-html 
      --ws-url=wss://itsusi.eu/analytics-ws
      --ignore-crawlers
      --port=443
      --origin=https://itsusi.eu
      --addr=0.0.0.0
      --debug-file=/report/goaccess_debug.log
      --invalid-requests=/report/goaccess_invalid.log
    volumes:
      - ./logs/nginx:/var/log/nginx:ro
      - ./goaccess-report:/report
    ports:
      - "7890:443"
    networks:
      - homepage_network

volumes:
  uploads_data:
    driver: local
  db_data:
    driver: local
  frontend_build:
    driver: local

networks:
  homepage_network:
    driver: bridge
